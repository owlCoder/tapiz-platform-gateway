# One-shot schema-push job, added as an extra service to the real Tapiz VPS
# compose file for this harness only. Runs `drizzle-kit push --force` from
# apps/api's own package.json script (`npm run db:push`) against the disposable
# `postgres` service, over the Compose project's private bridge network —
# never a host-mapped Postgres port (that pattern exists in
# apps/api/ops/vps/loadtest/docker-compose.loadtest.yml for a different,
# already-approved load-test harness, but Phase 1's hard constraints forbid any
# host port on Postgres, so this harness reaches it only from inside the
# private Docker network, exactly like every other Tapiz container does).
#
# Mounts the WHOLE tapiz-lms repo root READ-ONLY (not just apps/api) — this
# is an npm-workspaces monorepo, so the lockfile (package-lock.json) and the
# other workspaces' package.json files it references live at the repo root,
# exactly like the real Dockerfile's own `dependencies` stage COPYs them (see
# ../../../../CLAUDE.md / apps/api/ops/vps/Dockerfile). A first attempt that
# mounted only apps/api/ failed outright: `npm ci` refused with "can only
# install with an existing package-lock.json" because apps/api itself has no
# lockfile of its own.
#
# A second attempt mounted the repo root read-only but left every workspace's
# EXISTING node_modules/ (root, apps/api, apps/web, packages/sdk/typescript —
# real directories already present on this dev machine from normal local
# work) exposed through that same read-only bind mount. `npm ci` tried to
# clean/relink one of them (packages/sdk/typescript/node_modules/.vite) and
# failed with EROFS, because the read-only mount makes the whole real
# tapiz-lms tree immutable, including paths npm needs to write during
# install. Fixed by shadowing every workspace's node_modules path with its
# own disposable named volume (mounted on top of the read-only bind mount),
# so npm only ever writes into throwaway volumes and the real tapiz-lms
# checkout stays completely untouched.
services:
  schema-push:
    image: node:24.19.0-alpine3.23
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache python3 make g++ >/dev/null
        npm ci --workspace=apps/api --include-workspace-root=false
        cd apps/api
        npm run db:push -- --force
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      DB_SSL: "false"
    volumes:
      - ${TAPIZ_LMS_ROOT_DIR}:/workspace:ro
      - schema_push_root_node_modules:/workspace/node_modules
      - schema_push_api_node_modules:/workspace/apps/api/node_modules
      - schema_push_web_node_modules:/workspace/apps/web/node_modules
      - schema_push_sdk_node_modules:/workspace/packages/sdk/typescript/node_modules
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["schema-push"]

volumes:
  schema_push_root_node_modules:
  schema_push_api_node_modules:
  schema_push_web_node_modules:
  schema_push_sdk_node_modules:
