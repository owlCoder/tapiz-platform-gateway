# Harness-only addition to the real Boards VPS compose file (via -f), used
# on EVERY docker compose invocation in this harness (see run.sh's single
# boards_compose() function): a one-shot `migrate` service. Deliberately NOT
# reusing tapiz-boards/ops/vps/docker-compose.test.yml directly, because that
# file ALSO overrides `app`'s ports to publish a loopback host port
# (127.0.0.1:13004:3004) — this harness requires Boards to never publish any
# host port, not even loopback-only, so `migrate` is duplicated here instead
# (identical command/build/network shape to the real file's own `migrate`
# service) without pulling in that port override.
#
# Never a host-mapped Postgres port — reaches `postgres` only over the
# Compose project's own private `boards_internal` network, matching every
# other Boards container.
#
# `context` is `${BOARDS_DIR}` (an ABSOLUTE path, exported by run.sh) rather
# than a `../`-relative path: Compose resolves every merged -f file's
# relative paths against the FIRST -f file's directory (the real Boards
# docker-compose.yml, in ops/vps/), not this file's own directory — the same
# gotcha ../../real-stack/README.md already documented for the gateway's own
# ports-override files. An absolute path sidesteps it entirely.
#
# No `app` network-alias override here anymore: the real, unmodified
# tapiz-boards/ops/vps/docker-compose.yml now declares `boards-app` as an
# explicit alias on `boards_edge` itself (fixed at the source after this
# harness's first run surfaced the gap — see git history for the original
# "REAL BUG" writeup this comment replaces). This harness now runs the real
# Boards Compose file completely unmodified for that concern.
services:
  migrate:
    build:
      context: ${BOARDS_DIR}
      dockerfile: Dockerfile
      target: build
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://tapiz_boards_app:${BOARDS_APP_PASSWORD:?set BOARDS_APP_PASSWORD}@postgres:5432/tapiz_boards
    depends_on:
      postgres:
        condition: service_healthy
    networks: [boards_internal]
    profiles: [migrate]
