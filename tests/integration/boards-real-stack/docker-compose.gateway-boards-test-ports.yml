# Override the real gateway's 80/443 host bindings with unprivileged,
# local-only ports for THIS harness only. Distinct from every other
# harness's port pair: stub 18080/18443, real-stack 28080/28443,
# graceful-reload 38080/38443, chaos 48080/48443, scheduler-worker
# 58080/58443, backup-restore (see its own README) — this harness uses
# 61080/61443.
#
# Same two lessons already documented in ../../../README.md's "Real bugs
# found and fixed" section, reused verbatim rather than rediscovered:
#
# 1. Compose merges sequence-typed keys (`ports:`, `volumes:`) across -f
#    files additively unless tagged `!override` — without it this file would
#    ADD 61080/61443 alongside the base file's real 80/443, not replace them.
# 2. Every relative path in a merged -f file resolves against the FIRST -f
#    file's directory (the repo root, where the real docker-compose.yml
#    lives), not this file's own directory — so `./tests/integration/...`
#    below is written relative to the repo root, not to boards-real-stack/.
services:
  caddy:
    ports: !override
      - "61080:80"
      - "61443:443"
    volumes: !override
      - ./tests/integration/boards-real-stack/Caddyfile.boards-real-stack.test:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./snippets:/etc/caddy/snippets:ro
      - caddy_data:/data
      - caddy_config:/config
