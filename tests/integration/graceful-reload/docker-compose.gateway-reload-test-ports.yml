# Override the real gateway's 80/443 host bindings with unprivileged, local-only
# ports for THIS harness only. Distinct from tests/integration/docker-compose.gateway-test-ports.yml's
# 18080/18443 (the stub harness) and tests/integration/real-stack/docker-compose.gateway-real-test-ports.yml's
# 28080/28443 (Phase 1) so all three can coexist on one host without a port
# collision, even though they are not intended to run concurrently.
#
# Same two lessons already documented in ../../../README.md's "Real bugs found and
# fixed" section, reused verbatim rather than rediscovered:
#
# 1. Compose merges sequence-typed keys (`ports:`, `volumes:`) across -f files
#    additively unless tagged `!override` — without it this file would ADD
#    38080/38443 alongside the base file's real 80/443, not replace them.
# 2. Every relative path in a merged -f file resolves against the FIRST -f
#    file's directory (the repo root, where the real docker-compose.yml lives),
#    not this file's own directory — so `./tests/integration/...` below is
#    written relative to the repo root, not to graceful-reload/.
services:
  caddy:
    ports: !override
      - "38080:80"
      - "38443:443"
    volumes: !override
      - ./tests/integration/graceful-reload/Caddyfile.reload-test:/etc/caddy/Caddyfile:ro
      - ./tests/integration/graceful-reload/sites-live:/etc/caddy/sites:ro
      - ./snippets:/etc/caddy/snippets:ro
      - caddy_data:/data
      - caddy_config:/config
