# One-shot schema-push job, added as an extra service to the real Tapiz VPS
# compose file for this harness only. Identical in approach to
# ../real-stack/docker-compose.schema-push.yml (same bugs already found there:
# apps/api has no lockfile of its own, and the real tapiz-lms checkout's
# existing node_modules/ dirs must be shadowed with disposable volumes to avoid
# EROFS under a read-only repo-root mount) — duplicated here with reload-test
# volume names so this harness never shares Docker volumes with the real-stack
# harness's own schema-push run.
services:
  schema-push:
    image: node:24.19.0-alpine3.23
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache python3 make g++ >/dev/null
        npm ci --workspace=apps/api --include-workspace-root=false
        cd apps/api
        npm run db:push -- --force
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      DB_SSL: "false"
    volumes:
      - ${TAPIZ_LMS_ROOT_DIR}:/workspace:ro
      - schema_push_reload_root_node_modules:/workspace/node_modules
      - schema_push_reload_api_node_modules:/workspace/apps/api/node_modules
      - schema_push_reload_web_node_modules:/workspace/apps/web/node_modules
      - schema_push_reload_sdk_node_modules:/workspace/packages/sdk/typescript/node_modules
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["schema-push"]

volumes:
  schema_push_reload_root_node_modules:
  schema_push_reload_api_node_modules:
  schema_push_reload_web_node_modules:
  schema_push_reload_sdk_node_modules:
